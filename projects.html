  <h1>实战项目</h1>
  <p>AI/ML 领域的工程实践</p>
</div>

<div class="r-detail-wrap">
  <div class="projects-grid">
  </div>
</div>

<script>
(async function(){
  try{
    var r=await fetch('projects.json?v='+Date.now());
    if(!r.ok)throw Error();
    var projects=await r.json();
    var grid=document.querySelector('.projects-grid');
    if(!grid)return;
    if(!projects.length){
      grid.innerHTML='<div class="p-empty" style="grid-column:1/-1;text-align:center;padding:60px 20px"><div class="p-empty-icon">🔧</div><h3>暂无项目</h3><p>即将更新</p></div>';
      return;
    }
    grid.innerHTML=projects.map(function(p){
      return '<div class="p-card" onclick="location.href=\''+p.url+'\'" style="cursor:pointer">'+
        '<span class="p-card-icon">'+p.icon+'</span>'+
        '<h3>'+p.title+'</h3>'+
        '<p>'+p.description+'</p>'+
        '<div class="p-card-tech">'+p.tags.map(function(t){return '<span>'+t+'</span>'}).join('')+'</div>'+
        '</div>'
    }).join('');
  }catch(e){}
})();
</script>
